<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Compressor.js</title>
  <link rel="stylesheet" href="https://unpkg.com/bootstrap@4/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <style>
    .demo-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1>Watermark</h1>
    <hr>
    <div class="row">
      <div class="col">
        <h3>Input</h3>
        <div id="input">
          <img id="image" class="demo-image" src="../images/picture.png" alt="Picture">
        </div>
      </div>
      <div class="col">
        <h3>Output</h3>
        <div id="output"></div>
        <div id="status" class="mt-3"></div>
      </div>
    </div>
  </div>
  <script src="../js/compressor.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var Compressor = window.Compressor;
      var URL = window.URL || window.webkitURL;
      var image = document.getElementById('image');
      var output = document.getElementById('output');
      var status = document.getElementById('status');

      function showStatus(message, type) {
        status.className = 'mt-3 alert ' + (type === 'error' ? 'alert-danger' : 'alert-success');
        status.textContent = message;
      }

      function renderResult(result) {
        var newImage = new Image();

        newImage.src = URL.createObjectURL(result);
        newImage.alt = 'Compressed image';
        newImage.className = 'demo-image';
        output.innerHTML = '';
        output.appendChild(newImage);
        showStatus('Compression complete.', 'success');
      }

      var xhr = new XMLHttpRequest();

      xhr.onload = function () {
        new Compressor(xhr.response, {
          strict: false,
          drew: function (context, canvas) {
            context.fillStyle = '#fff';
            context.font = '2rem serif';
            context.fillText('Powered by Compressor.js', 20, canvas.height - 20);
          },
          success: renderResult,
          error: function (err) {
            showStatus(err && err.message ? err.message : 'Compression failed.', 'error');
          },
        });
      };

      xhr.onerror = function () {
        showStatus('Unable to load the image.', 'error');
      };

      xhr.open('GET', image.src);
      xhr.responseType = 'blob';
      xhr.send();
    });
  </script>
</body>
</html>
